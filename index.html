<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard WebGIS Semarang</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Chroma.js & Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #f8f9fa;
            --panel-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --accent: #2563eb;
        }

        body { margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-main); }
        
        /* Layout */
        .panel { width: 340px; background: var(--panel-bg); display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.05); z-index: 1000; overflow-y: auto; }
        .panel-left { border-right: 1px solid var(--border-color); }
        .panel-right { border-left: 1px solid var(--border-color); }
        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        /* Typography & Spacing */
        .header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .header h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
        .header p { font-size: 0.85rem; color: var(--text-muted); margin: 5px 0 0; }
        .content-section { padding: 20px; border-bottom: 1px solid var(--border-color); }
        
        /* Controls */
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; background: var(--bg-color); outline: none; cursor: pointer;}
        select:focus { border-color: var(--accent); }

        /* Legend */
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9rem; }
        .legend-color { width: 20px; height: 20px; margin-right: 12px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }

        /* Charts */
        .chart-container { margin-bottom: 25px; height: 200px; }
        .chart-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; text-align: center; color: var(--text-main); }

        /* Leaflet Overrides (Sleek Popup) */
        .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .leaflet-popup-content { margin: 15px; width: 240px !important; }
        .popup-title { font-size: 1.1rem; font-weight: 700; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; }
        .popup-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; border-bottom: 1px dashed #eee; padding-bottom: 4px;}
        .popup-row:last-child { border-bottom: none; }
        .popup-total { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; padding: 10px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: 700; font-size: 0.95rem;}

        /* Loading */
        #loader { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="loader">Sinkronisasi Data...</div>

    <!-- PANEL KIRI -->
    <div class="panel panel-left">
        <div class="header">
            <h1>Database Tata Ruang & E-Waste</h1>
            <p>Kota Semarang</p>
        </div>
        
        <div class="content-section">
            <label for="group-selector">Pilih Grup Data</label>
            <select id="group-selector">
                <option value="land_use">Land Use (Penggunaan Lahan)</option>
                <option value="demographic">Demographic (Demografi)</option>
                <option value="facilities">Facilities (Fasilitas)</option>
                <option value="waste_volume">Waste Volume (Volume Sampah)</option>
                <option value="flow">Flow (Aktor Informal)</option>
            </select>
        </div>

        <div class="content-section" id="legend-section">
            <label>Legenda Visualisasi</label>
            <div id="legend-content"></div>
        </div>
    </div>

    <!-- PETA UTAMA -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- PANEL KANAN -->
    <div class="panel panel-right">
        <div class="header">
            <h1>Analisis & Statistik</h1>
            <p id="right-panel-subtitle">Berdasarkan grup yang dipilih</p>
        </div>
        <div class="content-section">
            <div class="chart-container">
                <div class="chart-title" id="chart1-title">Grafik 1</div>
                <canvas id="chart1"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title" id="chart2-title">Grafik 2</div>
                <canvas id="chart2"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI URL ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxC9e2S_GYsODjTZli8IQWwpjhBzgfUjU2jELjlzeoLd7qibOqB1iSKm96yGxjEwOcIJg/exec'; 
        const GEOJSON_URL = 'kec_semarang.geojson';

        // --- INISIALISASI PETA (CLEAN BASEMAP) ---
        const map = L.map('map', { zoomControl: false }).setView([-7.0051, 110.4381], 12);
        L.control.zoom({ position: 'topright' }).addTo(map);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO'
        }).addTo(map);

        let geojsonLayer;
        let spreadsheetData = {};
        let rawDataArray = [];
        let charts = { chart1: null, chart2: null };

        // Konfigurasi Variabel Visualisasi Peta
        const groupConfig = {
            'land_use': { mapVar: 'builtup_ratio_pct', colorScale: 'YlGn', title: 'Rasio Lahan Terbangun' },
            'demographic': { mapVar: 'population_total', colorScale: 'Blues', title: 'Total Penduduk' },
            'facilities': { mapVar: 'tps_total', colorScale: 'OrRd', title: 'Jumlah TPS' },
            'waste_volume': { mapVar: 'waste_generation_total', colorScale: 'Reds', title: 'Timbulan Sampah (Kg)' },
            'flow': { mapVar: 'informal_actor_count', colorScale: 'Purples', title: 'Jumlah Aktor Informal' }
        };

        // --- FETCH DATA ---
        Promise.all([
            fetch(SCRIPT_URL).then(res => res.json()),
            fetch(GEOJSON_URL).then(res => res.json())
        ]).then(([sheetData, geoData]) => {
            rawDataArray = sheetData;
            sheetData.forEach(row => { spreadsheetData[row.kec_id] = row; });
            document.getElementById('loader').style.display = 'none';

            geojsonLayer = L.geoJSON(geoData, {
                style: styleFeature,
                onEachFeature: onEachFeature
            }).addTo(map);

            updateDashboard();
            document.getElementById('group-selector').addEventListener('change', updateDashboard);
        });

        function updateDashboard() {
            geojsonLayer.setStyle(styleFeature); 
            updateLegend();                      
            updateRightPanel();                  
            map.closePopup();                    
        }

        // --- STYLING & LEGENDA ---
        function styleFeature(feature) {
            const activeGroup = document.getElementById('group-selector').value;
            const config = groupConfig[activeGroup];
            const dataRow = spreadsheetData[feature.properties.kec_id];
            
            let val = dataRow ? dataRow[config.mapVar] : 0;
            let fillColor = '#e2e8f0'; 

            if (val !== undefined && val !== null) {
                const values = rawDataArray.map(d => d[config.mapVar]).filter(v => v !== undefined && v !== null);
                if(values.length > 0) {
                    const scale = chroma.scale(config.colorScale).domain([Math.min(...values), Math.max(...values)]);
                    fillColor = scale(val).hex();
                }
            }
            return { fillColor: fillColor, weight: 1.5, opacity: 1, color: '#ffffff', fillOpacity: 0.85 };
        }

        function updateLegend() {
            const activeGroup = document.getElementById('group-selector').value;
            const config = groupConfig[activeGroup];
            const values = rawDataArray.map(d => d[config.mapVar]).filter(v => v !== undefined);
            
            let html = '';
            if (values.length > 0) {
                const min = Math.min(...values);
                const max = Math.max(...values);
                const breaks = chroma.limits(values, 'e', 5);
                const scale = chroma.scale(config.colorScale).domain([min, max]);

                breaks.forEach((br, i) => {
                    if (i < breaks.length - 1) {
                        const color = scale((br + breaks[i+1])/2).hex();
                        html += `
                            <div class="legend-item">
                                <div class="legend-color" style="background-color: ${color}"></div>
                                <span>${br.toLocaleString('id-ID', {maximumFractionDigits:2})} - ${breaks[i+1].toLocaleString('id-ID', {maximumFractionDigits:2})}</span>
                            </div>
                        `;
                    }
                });
            }
            document.getElementById('legend-content').innerHTML = html;
        }

        // --- POPUP BUBBLE ---
        function onEachFeature(feature, layer) {
            // Mengambil nama kecamatan dari spreadsheet, jika gagal ambil dari geojson
            const kecId = feature.properties.kec_id;
            const dataRow = spreadsheetData[kecId] || {};
            const kecName = dataRow.kec_name || feature.properties.kec_name || feature.properties.KECAMATAN || "Data Wilayah Tidak Tersedia";
            
            layer.on({
                mouseover: (e) => { e.target.setStyle({ weight: 3, color: '#333' }); e.target.bringToFront(); },
                mouseout: (e) => { geojsonLayer.resetStyle(e.target); }
            });

            layer.on('click', function() {
                const activeGroup = document.getElementById('group-selector').value;
                let content = `<div class="popup-title">${kecName}</div>`;

                switch(activeGroup) {
                    case 'land_use':
                        content += `
                            <div class="popup-row"><span>Luas Terbangun:</span> <strong>${(dataRow.builtup_area_ha || 0).toLocaleString('id-ID')} Ha</strong></div>
                            <div class="popup-row"><span>Rasio Lahan:</span> <strong>${((dataRow.builtup_ratio_pct || 0) * 100).toFixed(1)}%</strong></div>
                        `;
                        break;
                    case 'demographic':
                        content += `
                            <div class="popup-row"><span>Total Penduduk:</span> <strong>${(dataRow.population_total || 0).toLocaleString('id-ID')} Jiwa</strong></div>
                            <div class="popup-row"><span>Total KK:</span> <strong>${(dataRow.household_total || 0).toLocaleString('id-ID')} KK</strong></div>
                            <div class="popup-row"><span>Kepadatan:</span> <strong>${(dataRow.density_pop_ha || 0).toFixed(1)} /Ha</strong></div>
                        `;
                        break;
                    case 'facilities':
                        const tps = dataRow.tps_total || 0;
                        const bank = dataRow.bank_sampah_total || 0;
                        const dropbox = dataRow.b3_dropbox_total || 0;
                        const total = tps + bank + dropbox;
                        content += `
                            <div class="popup-row"><span>TPS:</span> <strong>${tps}</strong></div>
                            <div class="popup-row"><span>Bank Sampah:</span> <strong>${bank}</strong></div>
                            <div class="popup-row"><span>Dropbox B3:</span> <strong>${dropbox}</strong></div>
                            <div class="popup-total">TOTAL FASILITAS: ${total}</div>
                        `;
                        break;
                    case 'waste_volume':
                        content += `
                            <div class="popup-row"><span>Timbulan Total:</span> <strong>${(dataRow.waste_generation_total || 0).toLocaleString('id-ID')} Kg/Bln</strong></div>
                            <div class="popup-row"><span>E-Waste Dilaporkan:</span> <strong>${(dataRow.ewaste_volume_reported || 0).toLocaleString('id-ID')} Kg/Bln</strong></div>
                            <div class="popup-row"><span>Status Data:</span> <strong>${dataRow.volume_data_status || '-'}</strong></div>
                        `;
                        break;
                    case 'flow':
                        content += `
                            <div class="popup-row"><span>Aktor Informal:</span> <strong>${dataRow.informal_actor_count || 0} Aktor</strong></div>
                            <div class="popup-row"><span>Tipe Aktor:</span> <strong>${dataRow.informal_actor_type || '-'}</strong></div>
                        `;
                        break;
                }
                layer.bindPopup(content, { autoPanPadding: [50, 50] }).openPopup();
            });
        }

        // --- PANEL KANAN (DEBUGGED & FIX JUDUL UNKNOWN) ---
        function updateRightPanel() {
            const selector = document.getElementById('group-selector');
            const activeText = selector.options[selector.selectedIndex].text; // Mengambil text persis dari dropdown
            const activeGroup = selector.value;
            const config = groupConfig[activeGroup];

            document.getElementById('right-panel-subtitle').innerText = activeText;

            if (charts.chart1) charts.chart1.destroy();
            if (charts.chart2) charts.chart2.destroy();

            const ctx1 = document.getElementById('chart1').getContext('2d');
            const ctx2 = document.getElementById('chart2').getContext('2d');

            Chart.defaults.font.family = "'Inter', sans-serif";

            // GRAFIK 1: Top 5 Berdasarkan Variabel Utama
            document.getElementById('chart1-title').innerText = "Top 5 " + config.title;
            const sorted = [...rawDataArray].filter(d => d[config.mapVar] != null).sort((a,b) => b[config.mapVar] - a[config.mapVar]).slice(0,5);
            
            charts.chart1 = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: sorted.map(d => d.kec_name),
                    datasets: [{ label: config.title, data: sorted.map(d => d[config.mapVar]), backgroundColor: '#3b82f6' }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            // GRAFIK 2: Komposisi spesifik sesuai grup
            if (activeGroup === 'facilities') {
                document.getElementById('chart2-title').innerText = "Proporsi Jenis Fasilitas Keseluruhan";
                charts.chart2 = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['TPS', 'Bank Sampah', 'Dropbox B3'],
                        datasets: [{ data: [sumData('tps_total'), sumData('bank_sampah_total'), sumData('b3_dropbox_total')], backgroundColor: ['#3b82f6', '#10b981', '#f59e0b'] }]
                    },
                    options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
                });
            } else if (activeGroup === 'land_use') {
                document.getElementById('chart2-title').innerText = "Perbandingan Lahan Semarang (Ha)";
                const totalBuiltup = sumData('builtup_area_ha');
                const totalArea = sumData('area_ha');
                charts.chart2 = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Area Terbangun', 'Area Non-Terbangun'],
                        datasets: [{ data: [totalBuiltup, totalArea - totalBuiltup], backgroundColor: ['#ef4444', '#e2e8f0'] }]
                    },
                    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });
            } else {
                // Fallback dinamis jika bukan land_use atau facilities
                document.getElementById('chart2-title').innerText = "Distribusi " + config.title;
                charts.chart2 = new Chart(ctx2, {
                    type: 'line',
                    data: {
                        labels: rawDataArray.map(d => d.kec_name),
                        datasets: [{ label: config.title, data: rawDataArray.map(d => d[config.mapVar]), borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.4 }]
                    },
                    options: { maintainAspectRatio: false, scales: { x: { display: false } }, plugins: { legend: { display: false } } }
                });
            }
        }

        function sumData(key) { return rawDataArray.reduce((a, b) => a + (Number(b[key]) || 0), 0); }
    </script>
</body>
</html>
